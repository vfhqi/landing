const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hk(raw){return crypto.subtle.importKey("raw",raw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);}
async function unlock(pass){
  const salt=b64(SALT),ct=b64(CT),tag=b64(TAG),enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveBits"]);
  const master=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:ROUNDS,hash:"SHA-256"},base,256));
  const mk=await hk(master);
  const encKey=await hk(new Uint8Array(await crypto.subtle.sign("HMAC",mk,enc.encode("enc"))));
  const macKey=await hk(new Uint8Array(await crypto.subtle.sign("HMAC",mk,enc.encode("mac"))));
  const msg=new Uint8Array(salt.length+ct.length);msg.set(salt);msg.set(ct,salt.length);
  const t2=new Uint8Array(await crypto.subtle.sign("HMAC",macKey,msg));
  let diff=0;for(let i=0;i<32;i++)diff|=t2[i]^tag[i];
  if(diff!==0)throw new Error("wrong passphrase");
  const out=new Uint8Array(ct.length),ctr=new Uint8Array(4);
  for(let i=0,off=0;off<ct.length;i++){ctr[0]=i>>>24;ctr[1]=(i>>>16)&255;ctr[2]=(i>>>8)&255;ctr[3]=i&255;
    const ks=new Uint8Array(await crypto.subtle.sign("HMAC",encKey,ctr));
    for(let j=0;j<32&&off<ct.length;j++,off++)out[off]=ct[off]^ks[j];}
  return new TextDecoder().decode(out);
}
function show(html){document.open();document.write(html);document.close();if(document.readyState==="complete")window.dispatchEvent(new Event("load"));}
async function go(pass,remember,quiet){
  try{const html=await unlock(pass);
    if(remember){try{localStorage.setItem("viewforth-site-pass",pass)}catch(e){}}
    show(html);return true;
  }catch(e){if(!quiet)document.getElementById("err").textContent="That passphrase did not open it.";return false;}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("p").value,document.getElementById("remember").checked,false);});
(async()=>{for(const k of ["viewforth-site-pass","ea-pass"]){let s=null;try{s=localStorage.getItem(k)}catch(e){}
  if(s&&await go(s,true,true))return;}})();
