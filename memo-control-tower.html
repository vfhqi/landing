<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Memo Control Tower</title>
<style>body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;margin:40px auto;max-width:640px;padding:0 16px;color:#333;background:#fbfaf7}
@media (prefers-color-scheme:dark){body{color:#ddd;background:#18181a}a{color:#9cc3ff}}</style>
</head><body><p id="live-msg">Loading the latest Memo Control Tower ...</p>
<script>
/* Live-page loader v1 (20-Nov-2026; projects/SA - SYSTEM OPTIMISATION D-PAGES-19; scripts/live_pages.py writes it).
   This page never changes, so updating the progress page never re-publishes this website. The page's content is kept in
   https://github.com/vfhqi/live-pages (GitHub Pages switched off) and drawn here: GitHub's file server first, its API second. */
(function () {
  var F = "memo-control-tower.html";
  var RAW = "https://raw.githubusercontent.com/vfhqi/live-pages/main/" + F;
  var API = "https://api.github.com/repos/vfhqi/live-pages/contents/" + F + "?ref=main";
  function whole(t) { return typeof t === "string" && t.length > 2000 && t.indexOf("</html>") > 0; }
  function get(u, h) {
    return fetch(u, { cache: "no-cache", headers: h || {} }).then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.text();
    }).then(function (t) { if (!whole(t)) { throw new Error("incomplete page"); } return t; });
  }
  function show(t) {
    var h = location.hash;
    document.open(); document.write(t); document.close();
    if (h) { setTimeout(function () { var e = document.getElementById(h.slice(1)); if (e) { e.scrollIntoView(); } }, 60); }
  }
  function fail(why) {
    var m = document.getElementById("live-msg");
    m.innerHTML = "This page could not load its latest content (" + why + "). " +
      (navigator.onLine === false ? "This device appears to be offline. " : "") +
      "Please reload in a minute.";
  }
  get(RAW).then(show).catch(function (e1) {
    return get(API, { "Accept": "application/vnd.github.raw" }).then(show).catch(function (e2) {
      fail(e1.message + "; " + e2.message);
    });
  });
})();
</script>
<noscript>This page needs JavaScript to show its latest content.</noscript>
</body></html>
