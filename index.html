<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>Viewforth — Landing</title>
<style>
  :root{
    --bg:#fbf9f1; --ink:#1c1c1c; --ink-dim:#5c5c5c; --line:#2a2a2a;
    --muted:#8a8a8a; --neutral:#c8c4b6; --gap:#7a7a7a;
    --yellow:#e6b800; --magenta:#c66ab0; --orange-fill:#f0a04b;
    --cyan:#5fb3c7; --blue:#5481c7; --green:#6aaa64;
    --pink:#e88aa6; --orange-out:#e07a3c; --substrate:#8b6f47;
    --tile:#fffdf6; --tile-hover:#fff8df;
    --font-sans:'Aptos','Segoe UI',-apple-system,system-ui,sans-serif;
    --font-mono:'Aptos Mono','SF Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);height:100%;}
  body{display:flex;flex-direction:column;overflow:hidden;}
  header{padding:6px 18px 4px;border-bottom:1px solid #ebe6d4;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;flex-shrink:0;}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px;}
  header h1 .sub{color:var(--ink-dim);font-weight:400;margin-left:6px;font-size:11px;}
  .status-strip{display:flex;gap:8px;font-size:10.5px;color:var(--ink-dim);font-family:var(--font-mono);align-items:center;flex-wrap:wrap;}
  .status-strip .pill{background:var(--tile);border:1px solid #e2dcc6;padding:2px 7px;border-radius:9px;}
  .status-strip .pill strong{color:var(--ink)}
  .legend{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:10px;color:var(--ink-dim);padding:4px 18px;border-bottom:1px solid #ebe6d4;flex-shrink:0;}
  .legend .sw{display:inline-flex;align-items:center;gap:4px;}
  .legend .sw i{display:inline-block;width:9px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,.15);}
  main.stage{flex:1 1 auto;min-height:0;padding:4px 8px;overflow:auto;}
  svg.flow{display:block;width:100%;height:100%;font-family:var(--font-sans);min-width:1100px;min-height:560px;}
  .node rect{fill:var(--tile);stroke:var(--line);stroke-width:1.4;rx:6;ry:6;transition:fill .12s ease;}
  .node:hover rect{fill:var(--tile-hover);}
  .node text{fill:var(--ink);pointer-events:none;}
  .node .title{font-size:13px;font-weight:600;}
  .node .sub{font-size:10.5px;fill:var(--ink-dim);}
  .node a{cursor:pointer;}
  .node a:focus rect{outline:2px solid var(--ink);outline-offset:2px;}
  .cluster{stroke:none;rx:14;ry:14;}
  .c-yellow      {fill:rgba(230,184,0,.12);}
  .c-magenta     {fill:rgba(198,106,176,.12);}
  .c-orange-fill {fill:rgba(240,160,75,.14);}
  .c-cyan        {fill:rgba(95,179,199,.13);}
  .c-blue        {fill:rgba(84,129,199,.12);}
  .c-green       {fill:rgba(106,170,100,.13);}
  .c-pink        {fill:rgba(232,138,166,.13);}
  .c-orange-out  {fill:rgba(224,122,60,.13);}
  .area-title {font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
  .at-yellow      {fill:#7a6300;}
  .at-magenta     {fill:#7a3568;}
  .at-cyan        {fill:#1f6f82;}
  .at-blue        {fill:#2c5398;}
  .at-green       {fill:#3a6a36;}
  .at-pink        {fill:#a64869;}
  .at-orange-out  {fill:#a04920;}
  .flow-line {stroke:var(--line);stroke-width:1.4;fill:none;}
  .flow-line.dotted{stroke-dasharray:5 4;stroke:var(--gap);}
  .inode rect{fill:#ffffff;stroke:var(--line);stroke-width:1.4;rx:8;ry:8;}
  .inode:hover rect{fill:var(--tile-hover);}
  .inode text{fill:var(--ink);pointer-events:none;}
  .inode .title{font-size:11.5px;font-weight:700;}
  .inode .sub{font-size:9.5px;fill:var(--ink-dim);font-style:italic;}
  .substrate-bar{fill:rgba(139,111,71,.10);stroke:var(--substrate);stroke-width:1.3;rx:7;ry:7;}
  .substrate-bar:hover{fill:rgba(139,111,71,.18);}
  .substrate-label{font-size:12px;font-weight:600;fill:#5b4727;letter-spacing:.4px;}
  .substrate-sub  {font-size:10px;fill:#7d6647;}
  .tab-pill rect{fill:#ffffff;stroke:#3a6a36;stroke-width:1.0;rx:9;ry:9;}
  .tab-pill:hover rect{fill:#e8f3e6;}
  .tab-pill text{fill:#2e4a2c;font-size:10px;font-weight:600;pointer-events:none;}
  .cyan-pill rect{fill:#ffffff;stroke:#1f6f82;stroke-width:1.0;rx:9;ry:9;}
  .cyan-pill:hover rect{fill:#e6f3f6;}
  .cyan-pill text{fill:#1f6f82;font-size:10px;font-weight:600;pointer-events:none;}
  .cyan-pill.placeholder rect{stroke-dasharray:3 3;}
  .reminder-link {cursor:pointer;}
  .reminder-link text {fill:#3a3a3a;font-size:11.5px;}
  .reminder-link:hover text {fill:#1c1c1c;text-decoration:underline;}
  footer{padding:4px 18px 6px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #ebe6d4;flex-shrink:0;}
  footer code{font-family:var(--font-mono);background:#f3eedc;padding:1px 5px;border-radius:3px;color:var(--ink-dim);}
  footer a{color:var(--ink-dim);}
  @media (max-width:900px){body{overflow:auto;}header{padding:6px 10px 4px;gap:8px;}header h1{font-size:14px;}.status-strip{font-size:10px;gap:4px;}.legend{padding:4px 10px;gap:3px 8px;font-size:9.5px;}main.stage{padding:4px 4px;}svg.flow{height:auto;}}
  @media (max-width:600px){header{flex-direction:column;align-items:flex-start;gap:4px;padding:6px 8px;}header h1{font-size:13px;}.status-strip{gap:3px;font-size:9.5px;}.status-strip .pill{padding:1px 5px;font-size:9.5px;}.legend{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;padding:3px 8px;}main.stage{padding:2px;overflow:auto;}svg.flow{min-width:1300px;}footer{font-size:9px;padding:3px 8px 4px;flex-direction:column;gap:2px;}}

  /* === v10 Visual Polish === */
  .node rect { stroke: rgba(60,60,60,0.14); stroke-width: 1.0; filter: url(#sh-node); }
  .tab-pill rect { filter: url(#sh-node); }
  .cyan-pill rect { filter: url(#sh-node); }
  .inode rect { filter: url(#sh-inode); }
  .flow-line { stroke: #8fa3b3; stroke-width: 1.6; opacity: 0.82; }
  .flow-line.dotted { stroke: #a8b8c4; opacity: 0.65; }
</style>
</head>
<body>

</header>

<script>
  // Render OKR list to a target group with wrap-on-spaces (no truncation).
  // Box width determines max chars per line; we wrap by character count not real width (good enough at this scale).
  function renderOKRList(targetId, opts){
    var data = JSON.parse(document.getElementById('okrs').textContent);
    var list = document.getElementById(targetId);
    if (!list) return;
    while (list.firstChild) list.removeChild(list.firstChild);
    var SVG_NS = 'http://www.w3.org/2000/svg';
    var x = opts.left;
    var centreX = opts.centre;
    var y = opts.y0;
    var lh = opts.lh;
    var maxChars = opts.maxChars;
    var fontSize = opts.fontSize;
    var tcFontSize = opts.tcFontSize;
    var stampFontSize = opts.stampFontSize;

    // TC line (centred, bold)
    data.portfolio_target_conditions.forEach(function(tc){
      var t = document.createElementNS(SVG_NS, 'text');
      t.setAttribute('x', centreX);
      t.setAttribute('y', y);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('style', 'font-size:'+tcFontSize+'px;font-weight:700;fill:#5c4400');
      t.textContent = 'TC: ' + tc.current + '/' + tc.target + ' stocks';
      list.appendChild(t);
      y += lh + 2;
    });
    y += 4;

    // OKR rows — wrap labels at word boundaries
    data.portfolio_okrs.forEach(function(o){
      var box = (o.filled_count >= o.target_count) ? '☑' : '☐';
      var label = o.description.replace(/^Add /,'');
      var counts = '(' + o.filled_count + '/' + o.target_count + ')';
      var prefix = box + ' ';
      // Wrap label at maxChars per line
      var words = label.split(' ');
      var lines = [];
      var current = '';
      words.forEach(function(w){
        var test = current ? (current + ' ' + w) : w;
        if (test.length <= maxChars) current = test;
        else { if (current) lines.push(current); current = w; }
      });
      if (current) lines.push(current);
      // Append counts to last line if it fits, else new line
      if (lines.length && (lines[lines.length-1].length + counts.length + 1) <= maxChars) {
        lines[lines.length-1] = lines[lines.length-1] + ' ' + counts;
      } else {
        lines.push(counts);
      }
      // Render lines
      lines.forEach(function(line, idx){
        var t = document.createElementNS(SVG_NS, 'text');
        t.setAttribute('x', x);
        t.setAttribute('y', y);
        t.setAttribute('text-anchor', 'start');
        t.setAttribute('style', 'font-size:'+fontSize+'px;fill:#3a3a3a');
        t.textContent = (idx === 0) ? (prefix + line) : ('   ' + line);
        list.appendChild(t);
        y += lh;
      });
      y += 2;
    });

    // Footer stamp
    var stamp = document.createElementNS(SVG_NS, 'text');
    stamp.setAttribute('x', centreX);
    stamp.setAttribute('y', y + 4);
    stamp.setAttribute('text-anchor', 'middle');
    stamp.setAttribute('style', 'font-size:'+stampFontSize+'px;font-style:italic;fill:#8a5a10');
    stamp.textContent = 'OKRs ' + data.period_label + ' · click to view JSON';
    list.appendChild(stamp);
  }

  // GAP card render — narrower, inside box x=940-1140
  renderOKRList('gap-okr-list', {
    left: 952, centre: 1040, y0: 378, lh: 11,
    maxChars: 28, fontSize: 8.5, tcFontSize: 9.5, stampFontSize: 7.5
  });

  // Strategic Targets render — wider, inside box x=954-1346
  renderOKRList('st-okr-list', {
    left: 970, centre: 1150, y0: 170, lh: 12,
    maxChars: 50, fontSize: 9.5, tcFontSize: 10.5, stampFontSize: 8
  });
</script>

<script>
  (function(){
    var d=new Date();
    var dd=String(d.getDate()).padStart(2,'0');
    var mm=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    var yy=String(d.getFullYear()).slice(-2);
    document.getElementById('d-date').textContent=dd+'-'+mm+'-'+yy;
  })();
  function applyMode(forceMode){
    var host=location.hostname;
    var isGh=(forceMode==='gh') || (host.endsWith('github.io'));
    document.getElementById('d-mode').textContent=isGh?'github pages':'local';
    document.getElementById('d-host').textContent=isGh?(host||'github.io'):'file://';
    document.querySelectorAll('a[data-href]').forEach(function(a){
      var local=(a.getAttribute('data-href')||'').replace(/^local:/,'');
      var gh=a.getAttribute('data-href-gh')||local;
      var target=isGh?gh:local;
      a.setAttribute('href',target);
      try{a.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',target);}catch(e){}
    });
  }
  applyMode();
  document.getElementById('d-toggle').addEventListener('click',function(e){
    e.preventDefault();
    var cur=document.getElementById('d-mode').textContent;
    applyMode(cur==='local'?'gh':'local');
  });
</script>
