}

// online, old answers and all, with nothing on it to say so. Runs are Sunday to Friday at 16:45 UK, built within about
// an hour. If the page was built before the latest such run that started over two hours ago, a red bar says so.
function ukMs(d){const p={};for(const x of new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d))p[x.type]=x.value;
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);}
function staleNote(html,nowMs){
  const dm=html.match(/<meta name="ea-page-date" content="(\d{4})-(\d{2})-(\d{2})">/),bm=html.match(/page built at (\d{2})(\d{2})h/);
  if(!dm||!bm)return "";
  const built=Date.UTC(+dm[1],+dm[2]-1,+dm[3],+bm[1],+bm[2]),now=ukMs(new Date(nowMs)),day=86400000;
  const nice=t=>new Date(t).toLocaleDateString("en-GB",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long"});
  for(let k=0,base=now-(now%day);k<9;k++,base-=day){const s=base+(16*60+45)*60000;
    if(new Date(s).getUTCDay()===6||s+2*3600000>now)continue;
    if(built>=s)return "";
    return "OUT OF DATE: this page was built on "+nice(built)+" at "+bm[1]+bm[2]+"h UK time. The 16:45 run of "+nice(s)+
      " should have replaced it by 1845h, and has not reached this page. Answers given here belong to this older page. "+
      "Tell Harry in any Cowork window: \"Harry: the briefing page is out of date\".";}
  return "";}
function showStale(html){const run=()=>{const t=staleNote(html,Date.now());let b=document.getElementById("stale");
  if(!t){if(b&&b.remove)b.remove();return;}
  if(!b){b=document.createElement("div");b.id="stale";b.style.cssText="background:#b00020;color:#fff;font:bold 15px system-ui,sans-serif;padding:10px 14px";
    const o=document.getElementById("out");o.insertBefore(b,o.firstChild);}
  b.textContent=t;};
  run();setInterval(run,600000);}   // re-checked every 10 minutes, so a tab left open overnight turns red too
async function go(pass,remember){
  try{let html=await unlock(pass);
    if(remember){try{localStorage.setItem("ea-pass",pass)}catch(e){}}
    document.getElementById("gate").style.display="none";
    document.body.style.cssText="margin:0;padding:0;max-width:none";
    // s30 (D-319): the answers key travels INSIDE the encrypted briefing; it is lifted out here and never shown to the frame
    const km=html.match(/<meta name="ea-answers" content="([^"]*)">/);if(km){const kv=km[1].split("|");REPO=kv[0];TOK=kv[1];html=html.replace(km[0],"");}
    const dm=html.match(/<meta name="ea-page-date" content="([^"]*)">/);PAGEDATE=dm?dm[1]:"";KEY="ea-answers-"+PAGEDATE;
    const fr=document.createElement("iframe");fr.setAttribute("sandbox",/http-equiv="Content-Security-Policy"/.test(html)?"allow-scripts":"");fr.style.height="100vh";fr.srcdoc=html;
    // s40b (13-Oct-26; Richard: the boxes are hard to reach on a phone): a one-line bar above the page links the daily
    // page and the requests page to each other (links inside the sandboxed frame cannot leave it)
    const bar=document.createElement("div");bar.style.cssText="font:600 15px system-ui,sans-serif;padding:8px 14px;background:#2e6b3a";
    const ln=document.createElement("a");ln.style.color="#fff";ln.style.textDecoration="none";
    if(PAGEDATE==="requests"){ln.href="../";ln.textContent="\u2190 Today's page";}else if(PAGEDATE==="ideas"){ln.href="../";ln.textContent="\u2190 The OKR page";}else{ln.href="requests/";ln.textContent="+ Add a request (new email, feedback, anything else)";}
    bar.appendChild(ln);document.getElementById("out").appendChild(bar);
    document.getElementById("out").appendChild(fr);FR=fr;try{showStale(html)}catch(_){}
  }catch(e){document.getElementById("err").textContent="That passphrase did not open it.";try{localStorage.removeItem("ea-pass")}catch(_){}}
}
// 17-Oct-26 (OKRs project, D-OKR-37): PAGEDATE "ideas" is the OKR idea capture page (projects/OKRs/tools/build_ideas_page.py);
// it gets its own bar link, pop-up heading and email subject; every other page is unchanged.
// s30 (D-319, D-335): the briefing's answer form talks to this page; this page keeps the answers (in this browser, and in
// the private answers store when the briefing carries a key) and offers the "Harry:" text to copy or email to Richard.
let FR=null,TOK=null,REPO=null,PAGEDATE="",KEY="ea-answers",SHA={},PT=null;
const b64u=s=>btoa(unescape(encodeURIComponent(s)));
async function gh(name,obj){if(!TOK||!REPO)return false;const path="answers/"+(PAGEDATE||"undated")+"/"+name+".json",url="https://api.github.com/repos/"+REPO+"/contents/"+path;
  const h={"Authorization":"Bearer "+TOK,"Accept":"application/vnd.github+json"};
  try{for(let t=0;t<2;t++){if(!(path in SHA)){const g=await fetch(url,{headers:h,cache:"no-store"});SHA[path]=g.ok?(await g.json()).sha:null;}
    const body={message:"EA answers "+name,content:b64u(JSON.stringify(obj,null,1))};if(SHA[path])body.sha=SHA[path];
    const r=await fetch(url,{method:"PUT",headers:h,body:JSON.stringify(body)});if(r.ok){SHA[path]=(await r.json()).content.sha;return true;}
    if(r.status!==409&&r.status!==422)return false;delete SHA[path];}return false;}catch(e){return false;}}
function tell(w){try{FR.contentWindow.postMessage({type:"ea-saved",where:w},"*")}catch(e){}}
function overlay(text,stored){let o=document.getElementById("ov");if(!o){o=document.createElement("div");o.id="ov";
  o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9";document.body.appendChild(o);}
  const when=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  o.innerHTML='<div style="background:#fff;max-width:680px;width:92%;padding:18px;border-radius:6px;font:14px system-ui,sans-serif">'+
   '<h3 style="margin-top:0">'+(PAGEDATE==="ideas"?'Your idea':'Your answers')+'</h3><p>'+(stored?'Saved to the answers store at '+when+'. In any Cowork window, say: <b>Harry: process my form answers</b>.':'Copy this into any Cowork window, or email it to yourself.')+'</p>'+
   '<textarea id="ovt" style="width:100%;height:180px;box-sizing:border-box" readonly></textarea>'+
   '<p><button id="ovc">Copy</button> <a id="ovm" href="#">Email it to myself</a> <button id="ovx" style="float:right">Close</button></p></div>';
  document.getElementById("ovt").value=text||"(no answers picked)";
  document.getElementById("ovm").href="mailto:RBlack@pacificam.co.uk?subject="+encodeURIComponent(PAGEDATE==="ideas"?"Idea for the OKR ideas list":"Harry: answers to the page of "+PAGEDATE)+"&body="+encodeURIComponent(text||"");
  document.getElementById("ovc").onclick=()=>{try{navigator.clipboard.writeText(text);document.getElementById("ovc").textContent="Copied"}catch(e){}};
  document.getElementById("ovx").onclick=()=>o.remove();}
window.addEventListener("message",async e=>{if(!FR||e.source!==FR.contentWindow)return;const m=e.data||{};
  if(m.type==="ea-ready"){let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){}FR.contentWindow.postMessage({type:"ea-restore",state:s},"*");
    tell(TOK?"Each answer is saved as you click, on every device.":"Answers are kept in this browser until you submit.");}
  if(m.type==="ea-state"){try{localStorage.setItem(KEY,JSON.stringify(m.state))}catch(_){}
    if(TOK){clearTimeout(PT);PT=setTimeout(async()=>{const ok=await gh("latest",{state:m.state,saved:new Date().toISOString()});tell(ok?"Saved to the answers store.":"Saved in this browser (the answers store did not answer).");},1500);}
    else tell("Saved in this browser.");}
  if(m.type==="ea-submit"){let ok=false;if(TOK){ok=await gh("submitted-"+Date.now(),{text:m.text,state:m.state,submitted:new Date().toISOString()});}overlay(m.text,ok);}
});
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("p").value,document.getElementById("remember").checked);});
try{const s=localStorage.getItem("ea-pass");if(s){document.getElementById("remember").checked=true;go(s,true);}}catch(e){}
</script></body></html>
